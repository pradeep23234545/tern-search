# Builds the Tern apps for Windows, macOS, Linux and Android.
#
# - Every push / pull request: builds everything and keeps the files as
#   workflow artifacts (Actions tab -> the run -> "Artifacts").
# - Pushing a tag like v1.1.0: also creates a GitHub Release with all files.
#     git tag v1.1.0 && git push origin v1.1.0
#
# Optional Android signing secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key (installs fine,
# but each build has a different key, so updates need an uninstall first).

name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci

      - run: npm run check

      - name: Build
        run: npx electron-builder --publish never
        env:
          # No Apple / Windows signing certificates: build unsigned (ad-hoc on macOS).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: tern-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tern.jks"
          echo "TERN_KEYSTORE_PATH=$RUNNER_TEMP/tern.jks" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle assembleRelease --no-daemon
        env:
          TERN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TERN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TERN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/release/app-release.apk "Tern-${version}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tern-android
          if-no-files-found: error
          path: apps/android/Tern-*-android.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*
